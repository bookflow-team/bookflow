name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: PR checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bookflow
          POSTGRES_PASSWORD: bookflow_ci
          POSTGRES_DB: bookflow_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U bookflow -d bookflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the proposed merge
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the proposed diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA" HEAD

      - name: Check which apps are present
        id: apps
        run: |
          for app in frontend backend; do
            if [[ -f "$app/package.json" ]]; then
              echo "$app=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::$app has no package.json. Application checks are skipped."
            fi
          done

      - name: Set up Node.js
        if: steps.apps.outputs.frontend == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Type-check and build frontend
        if: steps.apps.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Set up Bun
        if: steps.apps.outputs.backend == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.x'

      - name: Check backend tests
        if: steps.apps.outputs.backend == 'true'
        working-directory: backend
        env:
          DATABASE_URL: postgres://bookflow:bookflow_ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/bookflow_test
        run: |
          bun install --frozen-lockfile
          if bun -e 'process.exit(require("./package.json").scripts?.test ? 0 : 1)'; then
            if bun -e 'process.exit(require("./package.json").scripts?.["db:migrate"] ? 0 : 1)'; then
              bun run db:migrate
            fi
            bun run test
          else
            echo '::notice::Backend has no test script. Backend tests are skipped.'
          fi
